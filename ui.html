<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NiYoj</title>
<style>
  :root{
    --bg:#070b18; --panel:#0c1325; --panel2:#0a1020; --card:#10182c; --line:#263452;
    --ink:#f4f6fb; --dim:#91a0ca; --faint:#657399;
    --accent:#27c7dd; --amber:#f6b93b; --red:#f0616d; --blue:#5f86ee; --green:#4fdb78;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);overflow:hidden;user-select:none;
    font:13.5px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input,select{font:inherit}
  .grow{flex:1}

  header{
    display:flex;align-items:center;gap:10px;padding:0 14px;height:52px;flex:none;
    background:var(--panel);border-bottom:1px solid var(--line);position:relative;
  }
  /* explicit width: shrink-to-fit on an absolute child of a flex header comes out
     nearly half the screen wide */
  .menu{position:absolute;top:calc(100% + 6px);right:12px;z-index:60;width:172px;
        background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:5px;box-shadow:0 14px 34px #000b}
  .menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:7px}
  .menu button:hover{background:#1a2246}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700}
  .brand-copy{display:flex;flex-direction:column;line-height:1.15}
  .brand-sub{display:none;color:var(--dim);font-size:11px;font-weight:400;margin-top:2px}
  .logo .ver{font-weight:400;font-size:11px;opacity:.55}
  .logo img{width:24px;height:24px;display:block;border-radius:7px}
  .btn{padding:6px 12px;border-radius:7px;border:1px solid var(--line);
       background:var(--panel2);transition:.13s;white-space:nowrap}
  .btn:hover{background:#1a2246;border-color:#38427a}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.pri{background:var(--accent);color:#04222b;border-color:transparent;font-weight:600}
  .btn.pri:hover{background:#4ae3f7}
  .btn.danger:hover{background:#2a1418;border-color:#5b2630;color:var(--red)}
  .btn.sm{padding:4px 10px;font-size:12.5px}
  .burger{display:none;font-size:15px;line-height:1.2;padding:6px 11px}

  main{flex:1;display:flex;min-height:0}
  aside{width:250px;flex:none;background:var(--panel2);border-right:1px solid var(--line);
        display:flex;flex-direction:column}
  .cap{padding:14px 14px 7px;font-size:10.5px;letter-spacing:.9px;
       text-transform:uppercase;color:var(--faint)}
  .servers{flex:1;overflow:auto;padding:0 8px 10px}
  .sv{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;
      cursor:pointer;transition:.1s;margin-bottom:3px}
  .sv:hover{background:#151c3a}
  .sv.on{background:#1b2450;box-shadow:inset 2px 0 0 var(--accent)}
  .sv .t{flex:1;min-width:0}
  .sv b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sv small{color:var(--faint);font:11.5px ui-monospace,Consolas,monospace}
  .sv .n{font-size:11px;color:var(--faint)}

  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
  .dot.ok{background:var(--accent);box-shadow:0 0 6px #22d3ee66}
  .dot.fail{background:var(--red);box-shadow:0 0 6px #f0616d55}
  .dot.run{background:var(--amber);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.25}}

  section{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
  .shead{padding:15px 20px 13px;border-bottom:1px solid var(--line);background:var(--panel)}
  .stitle{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .stitle h1{margin:0;font-size:18px;font-weight:650}
  .online-line{display:none;color:var(--dim)}
  .server-summary{display:none}
  .section-title{display:none}
  .chip{padding:2.5px 9px;border-radius:20px;font-size:11px;background:#182046;
        border:1px solid var(--line);color:var(--dim)}
  .chip.mono{font-family:ui-monospace,Consolas,monospace}
  .chip.ok{color:var(--accent);border-color:#1c5566}
  .chip.fail{color:var(--red);border-color:#5b2630}
  .acts{display:flex;gap:8px;align-items:center}
  .acts input{padding:5px 10px;border-radius:7px;background:var(--bg);width:170px;
              border:1px solid var(--line);color:var(--ink);outline:none}
  .acts input:focus{border-color:#3f5fb0}

  .cards{flex:1;overflow:auto;padding:16px 20px;display:grid;gap:13px;align-content:start;
         grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px;
        display:flex;flex-direction:column;gap:9px;transition:.13s}
  .card:hover{border-color:#38427a;transform:translateY(-1px)}
  .card .top{display:flex;align-items:center;gap:8px}
  .card h3{margin:0;font-size:14.5px;font-weight:640;flex:1;overflow:hidden;
           text-overflow:ellipsis;white-space:nowrap}
  .card .br{font-size:11px;color:var(--faint);font-family:ui-monospace,Consolas,monospace}
  .card .meta{font:11.5px/1.6 ui-monospace,Consolas,monospace;color:var(--faint);min-width:0}
  .card .meta div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .st{font-size:11.5px;color:var(--dim)}
  .card .st.ok{color:var(--accent)} .card .st.fail{color:var(--red)}
  .card .st.run{color:var(--amber)}
  .card .row{display:flex;gap:6px;margin-top:auto}
  .card .row .btn{flex:none}
  .card .row .btn.pri{flex:1}

  .empty{margin:auto;text-align:center;color:var(--faint);padding:40px;grid-column:1/-1}
  .empty h2{color:var(--dim);font-weight:600;margin:0 0 6px}
  .welcome{max-width:620px}
  .welcome .welcome-logo{width:82px;height:82px;border-radius:24px;margin:0 auto 22px;display:block}
  .welcome h2{font-size:28px;color:var(--ink);line-height:1.15;margin-bottom:12px}
  .welcome p{font-size:15px;max-width:430px;margin:0 auto 24px;color:var(--dim)}
  .welcome .btn.pri{min-width:220px;padding:11px 20px}
  .welcome-link{display:block;margin:13px auto 0;color:var(--accent)}
  .first-steps{display:flex;align-items:center;justify-content:center;gap:18px;margin:34px auto 24px;color:var(--dim)}
  .first-step{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:74px}
  .step-no{display:grid;place-items:center;width:34px;height:34px;border:1px solid #4a5b86;border-radius:50%;color:var(--accent);font-weight:700}
  .step-arrow{color:#435072}
  .security-note{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-size:12px}
  .security-note strong,.form-security strong{color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.7px}

  .scrim{position:fixed;inset:0;background:#050718cc;backdrop-filter:blur(3px);
         display:grid;place-items:center;z-index:50}
  .modal{width:430px;max-height:88vh;overflow:auto;background:var(--panel);
         border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 18px 50px #000a}
  .modal.wide{width:620px}
  .modal.log{width:min(880px,92vw);padding:0;overflow:hidden;display:flex;flex-direction:column}
  .modal h2{margin:0 0 16px;font-size:15.5px;font-weight:650}
  .modal-titlebar{display:flex;gap:12px;align-items:center;margin-bottom:22px}
  .modal-titlebar h2{margin:0;font-size:20px}
  .modal-titlebar .sub{color:var(--dim);font-size:13px;margin-top:2px}
  .back-btn{height:38px;padding:0 11px;border:1px solid var(--line);border-radius:10px;color:var(--accent);font-size:12px;line-height:1}
  .form-security{display:flex;gap:9px;align-items:center;color:var(--dim);font-size:12px;margin:4px 0 12px}
  .f{margin-bottom:12px}
  .f label{display:block;font-size:11px;letter-spacing:.5px;color:var(--dim);margin-bottom:4px}
  .f input,.f select{width:100%;padding:8px 10px;border-radius:7px;background:var(--bg);
                     border:1px solid var(--line);color:var(--ink);outline:none}
  .f input:focus,.f select:focus{border-color:#3f5fb0}
  .f .hint{font-size:11px;color:var(--faint);margin-top:4px}
  .f .with{display:flex;gap:6px}
  .foot{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:18px}
  .err{font-size:12px;min-height:16px;margin-top:-4px;color:var(--red)}
  .err.good{color:var(--accent);font-weight:600}

  .loghead{display:flex;align-items:center;gap:10px;padding:13px 16px;
           border-bottom:1px solid var(--line);background:var(--panel)}
  .loghead h2{margin:0}
  .console{flex:1;margin:0;padding:14px 16px;overflow:auto;background:#060917;height:56vh;
           font:12.5px/1.65 ui-monospace,Consolas,monospace;white-space:pre-wrap;
           word-break:break-word;user-select:text}
  .console .cmd{color:var(--blue)} .console .sub{color:var(--faint)}
  .console .ok{color:var(--accent);font-weight:600}
  .console .bad{color:var(--red);font-weight:600}
  .deploy-status{padding:18px 20px 16px;border-bottom:1px solid var(--line)}
  .deploy-status .status-row{display:flex;gap:14px;align-items:center}
  .deploy-status progress{width:92px;height:8px;accent-color:var(--accent)}
  .deploy-status h3{margin:0;font-size:22px}
  .deploy-status p{margin:4px 0 0;color:var(--dim)}
  .deploy-steps{display:flex;justify-content:space-between;gap:8px;margin-top:18px;color:var(--faint);font-size:11px}
  .deploy-steps .done,.deploy-steps .active{color:var(--accent)}

  .scan{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;
        border:1px solid var(--line);margin-bottom:7px;cursor:pointer;background:var(--panel2)}
  .scan:hover{border-color:#38427a}
  .scan.known{opacity:.6}
  .scan input{margin-top:3px;accent-color:var(--accent)}
  .scan .path{font:11.5px/1.5 ui-monospace,Consolas,monospace;color:var(--faint);
              overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:10px;padding:1px 6px;border-radius:10px;margin-left:5px;
       background:#182046;border:1px solid var(--line);color:var(--dim)}
  .tag.ok{color:var(--accent);border-color:#1c5566}
  .tag.warn{color:var(--amber);border-color:#5b4620}
  .tag.live{color:var(--blue);border-color:#2b46a0}

  .f textarea{width:100%;padding:8px 10px;border-radius:7px;background:var(--bg);
              border:1px solid var(--line);color:var(--ink);outline:none;resize:vertical;
              user-select:text;font:11.5px/1.55 ui-monospace,Consolas,monospace}
  .f textarea:focus{border-color:#3f5fb0}
  .f a{color:var(--accent);text-decoration:none}

  .bottom-nav{display:none}

  /* Windows: a wider operations workspace with native-feeling density and hierarchy. */
  @media (min-width:761px){
    body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;background:#080c17}
    *{scrollbar-width:thin;scrollbar-color:#34425e #0a1020}
    *::-webkit-scrollbar{width:10px;height:10px}
    *::-webkit-scrollbar-track{background:#0a1020}
    *::-webkit-scrollbar-thumb{background:#34425e;border:3px solid #0a1020;border-radius:999px}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    header{height:64px;padding:0 22px;background:#0a1020;border-color:#202b43}
    .logo{gap:11px;font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;font-size:15px}
    .logo img{width:30px;height:30px;border-radius:9px}
    .brand-sub{display:block;font-size:10.5px;letter-spacing:.2px}
    .logo .ver{margin-left:4px;padding:3px 7px;border:1px solid #26334d;border-radius:999px;color:#8794b8;opacity:1;font-size:10px}
    .hdr-act{min-height:36px;padding:7px 14px;background:#0d1528}
    header .hdr-act:last-of-type{background:var(--accent);border-color:var(--accent);color:#032028;font-weight:700}
    aside{width:240px;background:#090f1d;border-color:#202b43}
    .cap{height:52px;padding:20px 18px 10px;display:flex;align-items:center;justify-content:space-between;color:#8290b2;font-weight:650;letter-spacing:1.15px}
    .cap-count{display:grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:#131d32;color:#9ba8c9;font-size:10px;letter-spacing:0}
    .servers{padding:4px 12px 16px}
    .sv{min-height:60px;padding:10px 12px;margin-bottom:6px;border:1px solid transparent;border-radius:10px}
    .sv:hover{background:#10182a;border-color:#202e49}
    .sv.on{background:#111d36;border-color:#2b3d60;box-shadow:inset 3px 0 0 var(--accent)}
    .sv b{font-size:14px;margin-bottom:2px}.sv small{font-size:11px;color:#7482a4}
    .sv .n{display:grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:7px;background:#18233a}
    .shead{padding:18px 28px 14px;background:#0a1020;border-color:#202b43}
    .stitle{margin:0;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:7px 12px}
    .stitle h1{min-width:0;font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;font-size:22px;line-height:1.2;letter-spacing:-.25px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .stitle .chip.mono{grid-column:1/3;justify-self:start;max-width:100%;padding:0;background:transparent;border:0;border-radius:0;color:#8290b2;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .stitle .chip:not(.mono){grid-column:3;grid-row:1/3;align-self:center;padding:5px 10px;background:#0e1a29}
    .server-summary{display:flex;gap:14px;margin:10px 0 12px;padding:0;border:0;background:transparent;color:#8290b2;font-size:11.5px}
    .server-summary span:last-child{margin-left:0;padding-left:14px;border-left:1px solid #26334d}.server-summary strong{color:var(--ink);font-weight:700}
    .acts{gap:7px;flex-wrap:wrap;min-width:0}.acts .btn{min-height:34px;flex:0 0 auto}
    .acts .grow{display:none}
    .acts .btn:nth-of-type(2){color:#09101e;background:#dce7ff;border-color:#dce7ff;font-weight:650}
    .acts .btn:nth-of-type(5){background:var(--accent);border-color:var(--accent);color:#032028;font-weight:700}
    .acts input{flex:1 1 190px;min-width:160px;width:auto;max-width:260px;min-height:34px;margin-left:auto;padding:7px 12px;background:#070c17;border-color:#26334d}
    .cards{padding:18px 28px 28px;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{min-height:148px;padding:14px 16px;background:#0e1729;border-color:#24324d;border-radius:10px;gap:8px;box-shadow:0 1px 0 #ffffff08}
    .card:hover{border-color:#3b5078;transform:translateY(-2px);box-shadow:0 12px 30px #0000002e}
    .card .top{align-items:flex-start}.card h3{font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;font-size:16px;line-height:1.25}
    .card .br{padding:3px 7px;border-radius:6px;background:#172238;color:#97a4c4;font-size:10px}
    .card .meta{padding:6px 0;border-top:1px solid #1d2941;border-bottom:1px solid #1d2941;color:#7d8aab;line-height:1.45}
    .card .meta .commit-line{display:none}
    .card .st{display:flex;align-items:center;gap:6px;font-size:11.5px}
    .card .st::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.9}
    .card .row{gap:7px;padding-top:1px}.card .row .btn{min-height:32px;padding:5px 12px}
    .card .row .btn.pri{flex:0 0 auto;min-width:96px}.empty{padding:64px}
    .scrim{place-items:stretch end;background:#050815b8}
    .modal{width:480px;height:100%;max-height:none;border-width:0 0 0 1px;border-radius:0;padding:28px;box-shadow:-24px 0 60px #0008}
    .modal.wide{width:600px}
    .modal.log{width:min(900px,calc(100vw - 80px));height:auto;max-height:88vh;margin:auto;border:1px solid var(--line);border-radius:12px;padding:0;box-shadow:0 22px 70px #000b}
    .modal h2{font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;font-size:20px}
    .f{margin-bottom:15px}.f label{font-size:11.5px}.f input,.f select{min-height:40px;padding:9px 11px;background:#080d19}
  }

  @media (min-width:761px) and (max-width:1050px){
    aside{width:216px}
    .shead{padding:18px 22px 14px}
    .server-summary{margin:9px 0 11px}
    .server-summary span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acts input{flex-basis:100%;width:100%;max-width:none;margin-left:0}
    .cards{padding:16px 22px 24px;grid-template-columns:minmax(0,1fr)}
    .card{min-height:148px}
  }

  /* Android: the shared WebView becomes an app-native, single-pane flow. */
  @media (max-width:760px){
    *{scrollbar-width:none}
    *::-webkit-scrollbar{display:none}
    html,body{height:100%;min-height:100%;overflow:hidden}
    body{font-size:14px;background:var(--bg)}
    header{height:76px;min-height:76px;padding:12px 20px;gap:10px;background:var(--bg);border-color:#141d31}
    .logo img{width:40px;height:40px;border-radius:11px}
    .logo{font-size:20px;gap:12px}
    .logo .ver{display:none}
    .brand-sub{display:block}
    main{min-height:0;display:block;overflow:hidden;padding-bottom:68px}
    aside{display:none}
    section{height:100%;overflow:hidden}
    .shead{padding:22px 20px 16px;background:var(--bg);border-color:#172238}
    .stitle{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-bottom:18px}
    .stitle h1{font-size:24px;line-height:1.2}
    .stitle .chip{display:none}
    .online-line{display:flex;align-items:center;gap:7px;grid-column:1/-1;font-size:14px}
    .online-line .dot{background:var(--green)}
    .server-summary{display:flex;justify-content:space-between;gap:16px;padding:15px 16px;margin:0 0 22px;border:1px solid #1d2a44;
                    border-radius:11px;background:#0d1527;color:var(--dim);font-size:12px}
    .server-summary strong{color:var(--ink);font-weight:600}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;font-size:19px;font-weight:650}
    .section-title button{color:var(--accent);font-size:13px}
    .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .acts .btn{min-height:42px}
    .acts .btn:nth-of-type(1),.acts .btn:nth-of-type(3),.acts .btn:nth-of-type(4),.acts .btn:nth-of-type(5){display:none}
    .acts .btn:nth-of-type(2){position:fixed;right:20px;bottom:84px;z-index:35;background:var(--accent);color:#03151c;
                                border-color:transparent;box-shadow:0 10px 28px #0008;font-weight:700}
    .acts input{grid-column:1/-1;grid-row:1;width:100%;height:42px;padding:9px 12px}
    .acts .grow{display:none}
    .cards{padding:6px 20px 24px;display:block;overflow:auto}
    .dashboard-cards{padding-bottom:104px}
    .card{background:transparent;border:0;border-bottom:1px solid #1f2c46;border-radius:0;padding:18px 0;display:grid;
          grid-template-columns:1fr auto;gap:6px 14px;transform:none!important}
    .card .top{grid-column:1/2;display:grid;grid-template-columns:auto 1fr;gap:5px 9px}
    .card .top .dot{grid-row:1/3}
    .card h3{font-size:17px}
    .card .br{grid-column:2;color:var(--dim);font-size:12px}
    .card .meta{grid-column:1/2;color:var(--faint);font-size:12px}
    .card .meta div:not(:first-child){display:none}
    .card .st{grid-column:1/2;font-size:12px}
    .card .row{grid-column:2;grid-row:1/4;align-self:center;display:flex;flex-direction:column}
    .card .row .btn{min-width:76px;padding:8px 12px;background:transparent;border-color:#30405f;color:var(--dim)}
    .card .row .btn.pri{background:transparent;color:var(--accent);border-color:var(--accent)}
    .dashboard-cards .card .row .btn:not(.pri){display:none}
    .welcome{padding:34px 28px 24px;margin:auto;max-width:430px}
    .welcome .welcome-logo{width:92px;height:92px;margin-bottom:26px}
    .welcome h2{font-size:31px;max-width:320px;margin-left:auto;margin-right:auto}
    .welcome p{font-size:16px;line-height:1.55;margin-bottom:28px}
    .welcome .btn.pri{display:block;width:100%;min-height:54px;font-size:17px;border-radius:12px}
    .first-steps{gap:9px;margin:34px 0 26px}
    .first-step{min-width:62px}
    .step-arrow{font-size:11px}
    .bottom-nav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;z-index:40;left:0;right:0;bottom:0;height:68px;
                border-top:1px solid #172238;background:#08101e}

    .btn{padding:9px 13px;min-height:40px;border-radius:10px}

// called from Python for every line of output
function logLine(app, line){
  let cls='';
  if(line.startsWith('$ ')) cls='cmd';
  else if(line.startsWith('| ')||line.startsWith('---')) cls='sub';
  else if(line.includes('=== ')) cls = line.includes(': OK') ? 'ok' : 'bad';
  logs[app] = (logs[app]||'') + (cls?`<span class="${cls}">${esc(line)}</span>`:esc(line));
  if(app!==logOpen) return;
  const c=$('con'); if(!c) return;
  const stick = c.scrollHeight - c.scrollTop - c.clientHeight < 40;   // respect scroll-up
  c.innerHTML = logs[app];
  if(stick) c.scrollTop = c.scrollHeight;
}

  if(!pick.length) return $('err').textContent='Nothing selected.';
  const r = await api.import_apps(s, pick);
  closeModal(); toast(`${r.added} added, ${r.updated} updated`); await boot();
}

/* apps */
function appModal(name){
  const a = name ? S.apps[name] : {branch:'main', server:sv};
  const opts = Object.keys(S.servers).map(s =>
    `<option ${a.server===s?'selected':''}>${esc(s)}</option>`).join('');
  if(!opts) return toast('Add a server first', true);
  openModal(`
    <h2>${name?'Edit app':'Add an app'}</h2>
    <div class="f"><label>App name</label>
      <input id="a_name" value="${esc(name||'')}" placeholder="myapp"
             oninput="if(!$('a_dir').dataset.touched)$('a_dir').value='/opt/'+this.value"></div>
    <div class="f"><label>Server</label><select id="a_server">${opts}</select></div>
    <div class="f"><label>Git repository</label>
      <input id="a_repo" value="${esc(a.repo||'')}" placeholder="https://github.com/you/myapp"></div>
    <div class="f"><label>Git token / auth <span style="color:var(--faint)">(optional, for private HTTPS repos)</span></label>
      <div class="with"><input type="password" id="a_token" value="${esc(a.token||'')}" placeholder="${(S.servers[a.server||sv]?.token)?'Using server default token':'ghp_... or auth token'}" autocomplete="new-password">
        <button type="button" class="btn" onclick="togglePass('a_token', this)">Show</button>
        <button type="button" class="btn" onclick="autoFillGhToken('a_token')" title="Import token from GitHub CLI"><i class="bi bi-github"></i> CLI</button>
        <button type="button" class="btn" onclick="openGhTokenGen()" title="Generate token on GitHub with pre-selected scopes"><i class="bi bi-box-arrow-up-right"></i> Web</button>
      </div>
      <div class="hint">${(S.servers[a.server||sv]?.token)?'Server default token is configured and will be used unless overridden here.':'Passed securely to git clone and fetch. Click <b>CLI</b> to grab from GitHub CLI or <b>Web</b> to generate on GitHub.'}</div></div>
    <div class="f" style="display:flex;gap:10px">
      <div style="flex:1"><label>Branch</label><input id="a_branch" value="${esc(a.branch||'main')}"></div>
      <div style="flex:2"><label>Path on server</label>
        <input id="a_dir" value="${esc(a.dir||'')}" onfocus="this.dataset.touched=1"></div>
    </div>
    <div class="f" style="display:${S.caps.upload===false?'none':''}"><label>Local folder to upload <span style="color:var(--faint)">(static site — instead of a repo)</span></label>
      <div class="with"><input id="a_local" value="${esc(a.local||'')}" placeholder="C:\\sites\\bodish.in\\out">
        <button class="btn" onclick="pickDir()"
                style="display:${S.caps.pick===false?'none':''}">Browse</button></div>
      <div class="hint">Set this and leave the repo empty: the folder is uploaded to
        the path on the server, replacing what's there.</div></div>
    <div class="f"><label>Custom command <span style="color:var(--faint)">(optional)</span></label>
      <input id="a_cmd" value="${esc(a.cmd||'')}" placeholder="leave empty">
      <div class="hint">Empty = clone if missing, reset to origin, run <code>deploy/deploy.sh</code>
        if the repo has one. First deploy and every redeploy take the same path.</div></div>
    <div class="f"><label>Platform admin command <span style="color:var(--faint)">(optional)</span></label>
      <input id="a_admincmd" value="${esc(a.admin_cmd||'')}" placeholder="npm run create-admin $EMAIL $PASSWORD">
      <div class="hint">Run on the server in the app path when you use the <b>Superadmin</b> button.
        <code>$EMAIL</code>/<code>$PASSWORD</code> are substituted; also available as
        <code>$ADMIN_EMAIL</code>, <code>$ADMIN_PASSWORD</code>, <code>$ADMIN_ACTION</code>.</div></div>
    <div class="f"><label>Platform admin table <span style="color:var(--faint)">(optional)</span></label>
      <input id="a_admindb" value="${esc(a.admin_db||'')}" placeholder="data/app.sqlite:users">
      <div class="hint">SQLite file (relative to the app path) and table to write the admin row into.
        Used when no command is set. Password stored as SHA-256.</div></div>
    <div class="err" id="err"></div>
    <div class="foot">
      ${name?`<button class="btn danger" onclick="delApp('${esc(name)}')">Delete</button>`:''}
      <div class="grow"></div>
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn pri" onclick="saveApp('${esc(name||'')}')">Save</button>
    </div>`);
}
function togglePass(id, btn){
  const el = $(id);
  if(!el) return;
  const isPass = el.type === 'password';
  el.type = isPass ? 'text' : 'password';
  btn.textContent = isPass ? 'Hide' : 'Show';
}
async function autoFillGhToken(targetId){
  const el = $(targetId);
  if(!el) return;
  toast('Checking GitHub CLI…');
  const r = await api.get_gh_accounts();
  if(!r.ok || !r.accounts || !r.accounts.length){
    return toast(r.msg || 'No GitHub accounts in GitHub CLI. Click Web to generate one.', true);
  }
  let pick = r.accounts[0];
  if(r.accounts.length > 1){
    const cur = el.dataset.ghUser;
    const nextIndex = cur ? (r.accounts.findIndex(a => a.user === cur) + 1) % r.accounts.length : 0;
    pick = (!cur && r.accounts.find(a => a.user === 'bodish-coder')) ? r.accounts.find(a => a.user === 'bodish-coder') : r.accounts[nextIndex];
    el.dataset.ghUser = pick.user;
  }
  el.value = pick.token;
  toast(`Imported token for ${pick.user}${r.accounts.length > 1 ? ' (click again to cycle)' : ''}`);
}
async function openGhTokenGen(){
  const url = 'https://github.com/settings/tokens/new?description=NiYoj%20Deploy%20Token&scopes=repo';
  await api.open_external(url);
  toast('Opening GitHub token generator in browser…');
}
async function saveApp(old){
  if(!val('a_name')) return $('err').textContent='Name is required.';
  if(!val('a_cmd') && !val('a_repo') && !val('a_local'))
    return $('err').textContent='Repository is required (or a local folder, or a custom command).';
  const r = await api.save_app(old, val('a_name'), {
    server:$('a_server').value, repo:val('a_repo'), token:val('a_token'), branch:val('a_branch')||'main',
    dir:val('a_dir')||('/opt/'+val('a_name')), cmd:val('a_cmd'), local:val('a_local'),
    admin_cmd:val('a_admincmd'), admin_db:val('a_admindb')});
  if(!r.ok) return $('err').textContent = r.msg;
  sv = $('a_server').value; closeModal(); toast('App saved'); await boot();
}
function delApp(n){
  openModal(`<h2>Remove ${esc(n)}?</h2>
    <p style="color:var(--dim);margin:0 0 4px">Removes it from this console only.
      Nothing on the server is touched.</p>
    <div class="foot"><div class="grow"></div>
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn danger" onclick="delAppGo('${esc(n)}')">Remove</button></div>`);
}
async function delAppGo(n){
  await api.delete_app(n); closeModal(); toast('App removed'); await boot();
}

/* superadmin modal */
async function superadminModal(appName){
  const a = S.apps[appName];
  if(!a) return toast('App not found', true);
  openModal(`
    <div class="modal-titlebar"><button class="back-btn" onclick="closeModal()" aria-label="Back">Back</button>
      <div><h2>Superadmin &middot; ${esc(appName)}</h2><div class="sub">${esc(a.server)} &middot; ${esc(a.dir||'/opt/'+appName)}</div></div></div>
    <div style="padding:16px 0;text-align:center;color:var(--dim)">
      <div class="dot run" style="margin:0 auto 10px;width:12px;height:12px"></div>
      Inspecting app accounts on server&hellip;
    </div>
  `, 'wide');

  const r = await api.inspect_superadmin(appName);
  if(!r.ok){
    return openModal(`
      <div class="modal-titlebar"><button class="back-btn" onclick="closeModal()" aria-label="Back">Back</button>
        <div><h2>Superadmin &middot; ${esc(appName)}</h2><div class="sub">${esc(a.server)}</div></div></div>
      <p style="color:var(--red)">Failed to inspect server: ${esc(r.msg)}</p>
      <div class="foot"><button class="btn" onclick="closeModal()">Close</button></div>
    `);
  }

  const userList = (r.users && r.users.length) ? r.users.map(u => `
    <div style="display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:6px">
      <span class="dot ok"></span>
      <b style="font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.email)}</b>
      <span class="chip" style="font-size:10.5px">${esc(u.role)}</span>
      <button class="btn sm" onclick="$('sa_email').value='${esc(u.email)}';$('sa_mode').value='update';updateSaMode();$('sa_pw').focus()" style="padding:3px 8px;font-size:11.5px">Use</button>
    </div>
  `).join('') : '<div style="color:var(--faint);font-size:12px;padding:4px 0 10px">No existing admin accounts detected yet.</div>';

  const defaultEmail = (r.users && r.users[0]?.email) || (S.servers[a.server]?.user === 'root' ? 'founder@bodish.in' : 'admin@'+appName+'.local');
  const defaultAction = (r.users && r.users.length) ? 'update' : 'create';

  openModal(`
    <div class="modal-titlebar"><button class="back-btn" onclick="closeModal()" aria-label="Back">Back</button>
      <div><h2>Superadmin &middot; ${esc(appName)}</h2><div class="sub">Stack: ${esc(r.type || 'standard')} &middot; ${esc(a.dir||'/opt/'+appName)}</div></div></div>

    <div style="margin-bottom:16px">
      <label style="display:block;font-size:11px;letter-spacing:.5px;color:var(--dim);margin-bottom:6px">Detected Admin Accounts</label>
      ${userList}
    </div>

    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">

    <div class="f"><label>Action</label>
      <select id="sa_mode" onchange="updateSaMode()">
        <option value="create" ${defaultAction==='create'?'selected':''}>Create Superadmin</option>
        <option value="update" ${defaultAction==='update'?'selected':''}>Change Password / Update Superadmin</option>
      </select>
    </div>

    <div class="f"><label id="sa_emaillabel">Admin Email / Username</label>
      <input id="sa_email" value="${esc(defaultEmail)}" placeholder="admin@example.com">
    </div>

    <div class="f"><label id="sa_pwlabel">New Password</label>
      <div class="with">
        <input type="password" id="sa_pw" placeholder="Enter secure password (min 6 chars)" autocomplete="new-password">
        <button type="button" class="btn" onclick="togglePass('sa_pw', this)">Show</button>
        <button type="button" class="btn" onclick="genSaPass()" title="Generate random strong password">Generate</button>
      </div>
      <div class="hint" id="sa_hint">Directly hashes and writes to the application database / environment on the droplet.</div>
    </div>

    <div class="form-security"><strong>Direct</strong> Uses secure SSH execution on server.</div>
    <div class="err" id="err"></div>

    <div class="foot">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn pri" id="sa_submit" onclick="submitSuperadmin('${esc(appName)}')">Save Superadmin</button>
    </div>
  `, 'wide');
}

function updateSaMode(){
  const mode = $('sa_mode')?.value;
  if(!mode) return;
  if($('sa_submit')) $('sa_submit').textContent = mode === 'create' ? 'Create Superadmin' : 'Update Password';
  if($('sa_pwlabel')) $('sa_pwlabel').textContent = mode === 'create' ? 'Set Initial Password' : 'Change Password to';
}

function genSaPass(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*';
  const max = 256 - (256 % chars.length);   // reject the tail so no char is favoured
  let pwd = '';
  while(pwd.length < 14){
    for(const n of crypto.getRandomValues(new Uint8Array(14))){
      if(n < max && pwd.length < 14) pwd += chars.charAt(n % chars.length);
    }
  }
  const el = $('sa_pw');
  if(el){
    el.value = pwd;
    el.type = 'text';
    const btn = el.nextElementSibling;
    if(btn && btn.tagName === 'BUTTON') btn.textContent = 'Hide';
  }
}

async function submitSuperadmin(appName){
  const email = val('sa_email');
  const pwd = val('sa_pw');
  const mode = $('sa_mode')?.value || 'create';
  if(!email) return $('err').textContent = 'Email / username is required.';
  if(!pwd || pwd.length < 6) return $('err').textContent = 'Password must be at least 6 characters.';

  const btn = $('sa_submit');
  btn.disabled = true;
  btn.textContent = 'Updating server…';
  $('err').className = 'err';
  $('err').textContent = 'Applying changes over SSH…';

  const r = await api.manage_superadmin(appName, mode, email, pwd);
  btn.disabled = false;
  btn.textContent = mode === 'create' ? 'Create Superadmin' : 'Update Password';

  if(!r.ok){
    $('err').className = 'err';
    return $('err').textContent = r.msg || 'Failed to apply credentials.';
  }

  $('err').className = 'err good';
  $('err').textContent = r.msg || 'Credentials successfully saved.';
  toast(r.msg || 'Superadmin updated');
  setTimeout(() => closeModal(), 1600);
}

/* a dropdown under the burger, not a modal — it is a menu, it should read as one */
function addMenu(){
  if($('menu')) return closeMenu();
  const m = document.createElement('div');
  m.className = 'menu'; m.id = 'menu';
  m.innerHTML = `<button onclick="closeMenu();serverModal()">+ Server</button>
                 <button onclick="closeMenu();appModal()">+ App</button>`;
  document.querySelector('header').appendChild(m);
  // next tick, or the click that opened it closes it again
  setTimeout(() => document.addEventListener('pointerdown', offMenu), 0);
}
function closeMenu(){
  const m = $('menu'); if(m) m.remove();
  document.removeEventListener('pointerdown', offMenu);
}
function offMenu(e){ if(!e.target.closest('.menu,.burger')) closeMenu(); }

function setActiveNav(tab){
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
}

/* ── ssh key ─────────────────────────────────────── */
async function keyModal(name){
  const s = S.servers[name] || {};
  const pw = S.caps.install_key === 'password';   // Android does it in-app; desktop uses a console
  openModal(`
    <h2>SSH key for ${esc(name)}</h2>
    <div class="f"><label>Private key file</label>
      <div class="with"><input id="k_path" value="${esc(s.key||S.caps.keypath||'~/.ssh/id_ed25519')}">
        <button class="btn" onclick="genKey()">Generate</button></div>
      <div class="hint">ed25519, no passphrase, so a deploy can never stop to ask.
        An existing key is reused, never overwritten.</div></div>
    <div class="f" id="k_pubwrap" style="display:none"><label id="k_publabel">Public key</label>
      <textarea id="k_pub" rows="3" readonly></textarea>
      <div class="hint"><a href="#" onclick="copyPub();return false">Copy</a> — this is the
        line that goes in the server's <code>~/.ssh/authorized_keys</code>.</div></div>
    ${pw?`<div class="f"><label>Server password</label>
      <input id="k_pw" type="password" autocomplete="off" placeholder="used once, never saved">
      <div class="hint">Needed only for this one hop — after the key lands, everything
        else is key-only.</div></div>`:''}
    <div class="err" id="err"></div>
    <div class="foot">
      <div class="grow"></div>
      <button class="btn" onclick="closeModal()">Close</button>
      <button class="btn" id="k_go" onclick="installKey('${esc(name)}')">Install on server</button>
      <button class="btn pri" onclick="verifyKey('${esc(name)}')">Verify &amp; save</button>
    </div>`);
  showPub(await api.read_key(val('k_path')));      // read-only: opening must not create a key
}
function showPub(pub, label){
  if(!pub) return;
  $('k_publabel').textContent = label || 'Public key';
  $('k_pub').value = pub;
  $('k_pubwrap').style.display = '';
}
function copyPub(){
  const t = $('k_pub');
  if(window.NiYoj) api.copy(t.value);              // WebView ignores execCommand
  else { t.focus(); t.select(); document.execCommand('copy'); }
  toast('Copied');
}
async function genKey(){
  const r = await api.gen_key(val('k_path'));
  if(!r.ok) return $('err').textContent = r.msg;
  $('k_path').value = r.path; showPub(r.pub);
  $('err').className = 'err good';
  $('err').textContent = r.existed ? 'Key already there — reusing it.' : 'New key created.';
}
async function installKey(name){
  const b = $('k_go'); b.disabled = true; b.textContent = 'Working…';
  $('err').className = 'err'; $('err').textContent = '';
  const r = await api.install_key(S.servers[name], val('k_path'),
                                  $('k_pw') ? $('k_pw').value : null);
  b.disabled = false; b.textContent = 'Install on server';
  if(!r.ok) return $('err').textContent = r.msg;
  if($('k_pw')) $('k_pw').value = '';
  showPub(r.pub);
  if(r.how === 'console')
    $('err').textContent = 'A console window opened — type the server password there, then Verify.';
  else if(r.how === 'manual'){
    showPub(r.cmd, 'Run this once, then Verify');
    $('err').textContent = 'No console to open here — run that command yourself.';
  } else {
    $('err').className = 'err good'; $('err').textContent = '✓ Key installed.';
  }
}
async function verifyKey(name){
  const key = val('k_path');
  $('err').className = 'err'; $('err').textContent = 'Connecting with the key…';
  const r = await api.test_conn(Object.assign({}, S.servers[name], {key}), name);
  $('err').className = 'err' + (r.ok ? ' good' : '');
  if(!r.ok) return $('err').textContent = '✗ ' + r.msg;
  await api.save_server(name, name, Object.assign({}, S.servers[name], {key}));
  $('err').textContent = '✓ Key works — saved on ' + name + '.';
  await boot();
}

document.onkeydown = e => { if(e.key==='Escape'){ closeMenu(); closeModal(); } };

// The ready event may already have fired before this script runs — cover both.
if (demoMode || window.NiYoj || (window.pywebview && window.pywebview.api)) boot();
else window.addEventListener('pywebviewready', boot);
